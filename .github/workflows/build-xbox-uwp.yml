# SPDX-License-Identifier: GPL-2.0-or-later
#
# Xbox Series X|S Dev Mode (UWP) + Windows Direct3D 12 CI/CD.
#
# Two build jobs and one release job:
#
#   windows-d3d12  Desktop Win64, GR2_RENDERER=D3D12. Proves the D3D12 backend
#                  and every HLSL SM 6.6 shader compile, and produces a runnable
#                  PC build for people who want to test the renderer before
#                  sideloading onto a console.
#
#   xbox-uwp-msix  WindowsStore/UWP, GR2_XBOX_UWP=ON, GR2_RENDERER=D3D12.
#                  Produces GR2port-XboxSeriesXS-UWP.zip: the signed .msix, the
#                  .cer that signs it, and QUICKSTART-XBOX.txt.
#
#   release        Attaches both to a Pre-Release on main and a full Release on
#                  a v* tag.
#
# The workflow never depends on the upstream repository: gr2port's own
# build.yml hardcoded `github.repository == 'junminlee2004/GR2port'`, which
# silenced releases on forks, and this workflow has no such gate.

name: Xbox UWP (MSIX) and Windows D3D12

on:
  push:
    branches:
      - main
      - "arena/**"
      - "xbox/**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      renderer:
        description: "Renderer backend to build"
        type: choice
        options: [D3D12, VULKAN]
        default: D3D12
      skip_uwp:
        description: "Only build the desktop D3D12 job"
        type: boolean
        default: false
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Deliberately no cancel-in-progress. Cancelling a run at minute 18 of a cold
  # build throws away every object it had compiled, and that happened three
  # times in a row before this was reverted: the queued run then also had to
  # start cold, so cancelling cost more than waiting.
  #
  # A superseded run is left to finish and its result ignored.
  cancel-in-progress: false

env:
  BUILD_TYPE: Release
  # Pinned so the console package is reproducible between runs.
  GR2_VERSION: "1.0.0.0"

jobs:
  # ---------------------------------------------------------------------------
  # Guardrail: refuse to build a repository that ever gained game data.
  # ---------------------------------------------------------------------------
  # The cheap gate. Runs before the 25-minute Windows jobs so a missing include or
  # a wrong method name is caught in under a minute. It compiles and *runs* the
  # host-portable units with the real fmt and spdlog headers; the same script is
  # meant to be run locally before every push.
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify no copyrighted game data is tracked
        run: tools/ci/check_no_game_data.sh --all
      - name: Verify the shader port's coverage report is honest
        run: python3 tools/shaders/check_shader_coverage.py
      - name: Verify the D3D12 shader manifest covers every HLSL file
        run: python3 tools/shaders/generate_d3d12_manifest.py --check
      # dxc is Windows-only, so the structural mistakes it reports are cheaper to
      # find here. Every rule in this script is a failure that cost a Windows run.
      - name: Check the ported HLSL for structural errors
        run: python3 tools/shaders/check_hlsl_structure.py
      - name: Compile and run the host-portable units
        run: tools/ci/local_precheck.sh
      # Annotations are capped and the annotations API truncates; the log file is
      # the one place a compiler's full output survives. Uploaded always, so a
      # failed run can be read instead of guessed at.
      - name: Upload the precheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-precheck
          path: |
            local-precheck.log
          if-no-files-found: warn

  get-info:
    runs-on: ubuntu-latest
    needs: source-guard
    outputs:
      date: ${{ steps.vars.outputs.date }}
      shorthash: ${{ steps.vars.outputs.shorthash }}
      fullhash: ${{ steps.vars.outputs.fullhash }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "shorthash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "fullhash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Job 1: Desktop Win64 Direct3D 12
  # ---------------------------------------------------------------------------
  windows-d3d12:
    runs-on: windows-2022
    needs: get-info
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ccache: the single biggest lever on iteration time. A cold build of the
      # emulator core is ~25 minutes; with a warm cache a one-file change is ~2.
      # The cache key tracks the CMake files (which decide compile flags) and the
      # compiler version, and falls back to the newest matching cache, so a change
      # to one backend still reuses the objects the other shares.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.21
        with:
          key: win64-d3d12-${{ env.BUILD_TYPE }}
          max-size: 2G
          append-timestamp: false
          # Save on failure too. The action's default is to save only on success,
          # so a job that fails at minute 18 of a cold build -- which is most of
          # them -- threw away everything it had compiled and started from nothing
          # again. A partial cache is still ~20 minutes of work.
          save-always: true

      # clang-cl, not cl.exe: this is the compiler upstream's CI uses, and it is
      # not interchangeable. MSVC rejects casts clang-cl accepts in code we do
      # not own -- the vendored ImGui demo's `(ImVec4)ImColor::HSV(...)`, made
      # ambiguous by this project's float ImVec4 constructor -- and upstream's
      # -march flags are clang spelling, so cl.exe merely warned that it was
      # ignoring them. Building with the compiler the project targets avoids
      # patching a dependency over a diagnosable difference.
      - name: Set up the MSVC developer environment (for clang-cl and the SDK)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Locate dxc
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse `
              -Filter dxc.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dxc) {
            Write-Error "dxc.exe not found in the Windows SDK; the D3D12 shader build cannot run."
          }
          Write-Host "Using dxc: $($dxc.FullName)"
          "GR2_DXC_EXECUTABLE=$($dxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        shell: pwsh
        run: |
          # CMake's failure text is what a reader needs, but the raw log is not
          # always reachable (a large matrix log can be truncated). Re-emit any
          # error line as an annotation so the reason survives in the checks UI.
          $ErrorActionPreference = 'Continue'
          cmake -S . -B build-win64 -G Ninja `
                "-DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}" `
                "-DGR2_RENDERER=D3D12" `
                "-DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON" `
                "-DGR2_DXC_EXECUTABLE=${{ env.GR2_DXC_EXECUTABLE }}" `
                "-DCMAKE_C_COMPILER=clang-cl" `
                "-DCMAKE_CXX_COMPILER=clang-cl" `
                "-DCMAKE_C_COMPILER_LAUNCHER=ccache" `
                "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache" `
                "-DENABLE_UPDATER=OFF" 2>&1 |
              Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            ./scripts/ci/annotate_failure.ps1 -LogFile configure.log
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # `-- -k 0`: Ninja keeps going after a failure and reports every
          # remaining error, both compilers' and dxc's. Without it a run costs 25
          # minutes and reveals exactly one typo.
          cmake --build build-win64 --config ${{ env.BUILD_TYPE }} `
                --parallel -- -k 0 2>&1 |
            Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            ./scripts/ci/annotate_failure.ps1 -LogFile build.log
            exit 1
          }

      # A failed build's log is the whole diagnosis, and the raw job log of a
      # large matrix run is not always retrievable. Upload it unconditionally so
      # it is always there.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-win64-d3d12
          path: build.log
          if-no-files-found: ignore

      - name: Run the Xbox budget and chord self-tests
        run: |
          ctest --test-dir build-win64 --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $exe = Get-ChildItem build-win64 -Recurse -Filter "*.exe" |
              Where-Object { $_.Name -notmatch 'selftest|test' } |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { Write-Error "No executable was produced." }
          Copy-Item $exe.FullName "artifacts/GR2port.exe"
          Copy-Item src/dist/README.txt artifacts/README.txt -ErrorAction SilentlyContinue
          Compress-Archive -Path "artifacts/*" -DestinationPath "GR2port-Win64-D3D12.zip" -Force
          Write-Host "Desktop D3D12 build packaged."

      - uses: actions/upload-artifact@v4
        with:
          name: gr2port-win64-d3d12-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}
          path: GR2port-Win64-D3D12.zip
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 2: Xbox Series X|S UWP package
  # ---------------------------------------------------------------------------
  # Parallel with windows-d3d12, not after it. The WindowsStore compile is where
  # UWP-only errors surface, and gating it behind the 25-minute desktop build meant
  # waiting half an hour for an answer that was available immediately.
  xbox-uwp-msix:
    runs-on: windows-2022
    needs: get-info
    if: ${{ !inputs.skip_uwp }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Guard against committed game data
        shell: bash
        run: tools/ci/check_no_game_data.sh --all

      # Its own cache key: UWP objects differ from the desktop ones (different
      # WINAPI_FAMILY, different libs), and sharing a key would make each job
      # evict the other's work.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.21
        with:
          key: xbox-uwp-${{ env.BUILD_TYPE }}
          max-size: 2G
          append-timestamp: false
          save-always: true

      - name: Set up the MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Locate dxc
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse `
              -Filter dxc.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dxc) { Write-Error "dxc.exe not found; the UWP shader build cannot run." }
          "GR2_DXC_EXECUTABLE=$($dxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure (WindowsStore / UWP)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmake -S . -B build-uwp -G Ninja `
                "-DCMAKE_SYSTEM_NAME=WindowsStore" `
                "-DCMAKE_SYSTEM_VERSION=10.0.22621.0" `
                "-DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}" `
                "-DGR2_XBOX_UWP=ON" `
                "-DGR2_RENDERER=D3D12" `
                "-DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON" `
                "-DGR2_DXC_EXECUTABLE=${{ env.GR2_DXC_EXECUTABLE }}" `
                "-DCMAKE_C_COMPILER=clang-cl" `
                "-DCMAKE_CXX_COMPILER=clang-cl" `
                "-DCMAKE_C_COMPILER_LAUNCHER=ccache" `
                "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache" `
                "-DENABLE_UPDATER=OFF" 2>&1 |
              Tee-Object -FilePath configure-uwp.log
          if ($LASTEXITCODE -ne 0) {
            ./scripts/ci/annotate_failure.ps1 -LogFile configure-uwp.log
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmake --build build-uwp --config ${{ env.BUILD_TYPE }} `
                --parallel -- -k 0 2>&1 |
            Tee-Object -FilePath build-uwp.log
          if ($LASTEXITCODE -ne 0) {
            ./scripts/ci/annotate_failure.ps1 -LogFile build-uwp.log
            exit 1
          }

      - name: Upload UWP build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-xbox-uwp
          path: |
            build-uwp.log
            configure-uwp.log
            test-host-budget.log
            test-host-run.log
          if-no-files-found: ignore

      - name: Create the Dev Mode signing certificate
        shell: pwsh
        env:
          GR2_CERT_PFX_BASE64: ${{ secrets.GR2_CERT_PFX_BASE64 }}
          GR2_CERT_PASSWORD: ${{ secrets.GR2_CERT_PASSWORD }}
        run: |
          ./scripts/ci/make_certificate.ps1 -OutDir xbox-package/signing

      - name: Stage, pack and sign the MSIX
        shell: pwsh
        run: |
          ./scripts/ci/package_msix.ps1 `
            -BuildDir build-uwp `
            -ExeName "GR2port.exe" `
            -Version "${{ env.GR2_VERSION }}" `
            -SigningDir xbox-package/signing

      - name: Verify the bundle contents
        shell: pwsh
        run: |
          $zip = "xbox-package/GR2port-XboxSeriesXS-UWP.zip"
          if (-not (Test-Path $zip)) { Write-Error "The bundle was not produced." }
          $expected = @("GR2port-XboxSeriesXS-UWP_x64.msix", "GR2port-XboxDevMode.cer")
          $entries = (Get-ChildItem xbox-package/out -File).Name
          foreach ($name in $expected) {
            if ($entries -notcontains $name) { Write-Error "Missing $name in the bundle." }
          }
          Write-Host "Bundle verified: $($entries -join ', ')"

      - uses: actions/upload-artifact@v4
        with:
          name: gr2port-xbox-uwp-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}
          path: |
            xbox-package/GR2port-XboxSeriesXS-UWP.zip
            xbox-package/out/*.msix
            xbox-package/out/*.cer
          if-no-files-found: error
          retention-days: 30

      - name: Write the job summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## Xbox Series X|S package

          | Artifact | Purpose |
          | --- | --- |
          | ``GR2port-XboxSeriesXS-UWP_x64.msix`` | The signed package. Sideload with Xbox Device Portal. |
          | ``GR2port-XboxDevMode.cer`` | The certificate the console must trust first. |
          | ``GR2port-XboxSeriesXS-UWP.zip`` | All of the above plus ``QUICKSTART-XBOX.txt``. |

          **After installing, set the app's type to _Game_ in Xbox Device Portal.**
          Left as _App_ the title gets roughly 1 GB of memory instead of the
          ~5 GB Game-mode pool and will fail with ``ERROR_COMMITMENT_LIMIT``.

          See ``docs/XBOX_DEV_MODE_GUIDE.md`` for the full walkthrough.
          "@ >> $env:GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Job 3: Release
  # ---------------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [get-info, windows-d3d12, xbox-uwp-msix]
    if: |
      always() &&
      needs.windows-d3d12.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      FULLHASH: ${{ needs.get-info.outputs.fullhash }}
      SHORTHASH: ${{ needs.get-info.outputs.shorthash }}
      DATE: ${{ needs.get-info.outputs.date }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Collect the packages
        run: |
          ls -R ./artifacts
          mkdir -p dist
          cp ./artifacts/gr2port-win64-d3d12-*/*.zip dist/ 2>/dev/null || true
          cp ./artifacts/gr2port-xbox-uwp-*/GR2port-XboxSeriesXS-UWP.zip dist/ 2>/dev/null || true
          ls -la dist

      - name: Publish the release
        run: |
          assets=()
          [ -f dist/GR2port-Win64-D3D12.zip ] && assets+=("dist/GR2port-Win64-D3D12.zip#GR2port Win64 Direct3D 12 build")
          [ -f dist/GR2port-XboxSeriesXS-UWP.zip ] && assets+=("dist/GR2port-XboxSeriesXS-UWP.zip#GR2port Xbox Series X|S UWP (.msix + .cer)")

          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::Nothing to release; no build artifact was found."
            exit 1
          fi

          notes=$(cat <<EOF
          ### GR2toXBOX — Direct3D 12 + Xbox Series X|S Dev Mode

          Built from commit [\`${FULLHASH}\`](https://github.com/${GH_REPO}/commit/${FULLHASH}).

          **Xbox Series X|S** — sideload \`.msix\` with the included \`.cer\` through
          Xbox Device Portal, then set the app's type to **Game** (not App) or it
          will run out of memory at boot. See \`docs/XBOX_DEV_MODE_GUIDE.md\`.

          **Windows PC** — unzip and run \`GR2port.exe\` (Direct3D 12 build).

          This release contains no game data. You must supply your own legally
          dumped Gravity Rush 2 (PS4) v1.11 files.
          EOF
          )

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            gh release create "${GITHUB_REF_NAME}" \
              --target "${FULLHASH}" \
              --title "GR2toXBOX ${GITHUB_REF_NAME}" \
              --notes "$notes" \
              "${assets[@]}"
          else
            tag="Xbox-Pre-release-${DATE}-${SHORTHASH}"
            gh release create "$tag" \
              --target "${FULLHASH}" \
              --prerelease \
              --title "Xbox pre-release ${DATE} (${SHORTHASH})" \
              --notes "$notes" \
              "${assets[@]}"
          fi
